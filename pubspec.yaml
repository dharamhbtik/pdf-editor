name: pdf_editor
description: A comprehensive cross-platform PDF editor for mobile, web, and desktop with ATS compliance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # PDF handling
  pdf: ^3.10.7
  printing: ^5.12.0
  syncfusion_flutter_pdf: ^24.2.9
  
  # File operations
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # State management
  provider: ^6.1.1
  
  # Platform detection
  universal_io: ^2.2.2
  
  # Image handling
  image: ^4.1.3
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Responsive UI
  flutter_screenutil: ^5.9.0
  
  # Icons
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
